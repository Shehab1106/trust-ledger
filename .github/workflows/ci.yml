name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Postgres schema suite via testcontainers. GitHub's ubuntu runners
      # ship a running Docker daemon, so the triggers are enforced for real.
      - run: npm run test:db
